<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plant Explorer 3D | ห้องเรียนมหัศจรรย์ของพืช ม.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f3a2d;--mut:#5f7467;--g1:#1f6b4a;--g2:#43a56b;--gold:#f2b94b;--glass:rgba(255,255,255,.62);--line:rgba(255,255,255,.8)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Prompt','Noto Sans Thai',Tahoma,system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 10%,#d9f2e2,transparent 28rem),radial-gradient(circle at 95% 90%,#fde9c8,transparent 26rem),linear-gradient(135deg,#eaf6ef,#f9f5ea);line-height:1.6}
button{font:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;margin:12px 14px 0;border-radius:20px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(31,90,60,.1)}
.brand{display:flex;align-items:center;gap:10px}.brand b{font-size:20px;letter-spacing:-.3px}.brand small{display:block;color:var(--mut);font-size:12px;margin-top:-4px}
.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,#2c8a5b,#79c47f);box-shadow:0 6px 14px rgba(44,138,91,.35)}
nav{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tab{border:1px solid transparent;background:rgba(255,255,255,.5);border-radius:13px;padding:7px 12px;color:#355945;font-weight:500;font-size:14px;transition:.2s}
.tab:hover{transform:translateY(-2px);background:#fff}.tab.on{background:linear-gradient(135deg,#1f6b4a,#43a56b);color:#fff;box-shadow:0 6px 14px rgba(31,107,74,.3)}.tab.ok:after{content:" ⭐"}
.prog{min-width:140px;font-size:12px;color:var(--mut)}.bar{height:8px;background:rgba(31,107,74,.15);border-radius:9px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#43a56b,#f2b94b);transition:width .4s}
main{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:14px;padding:14px;height:calc(100vh - 86px);min-height:560px}
#stage{position:relative;overflow:hidden;border-radius:26px;border:1px solid var(--line);background:linear-gradient(180deg,#cfeefb 0%,#e9f7ea 55%,#fdf3dc 100%);box-shadow:0 16px 40px rgba(31,90,60,.14);touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}#c:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.mk{position:absolute;left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:2px solid var(--gold);background:rgba(255,255,255,.9);color:#7a5a12;font-weight:700;font-size:13px;display:grid;place-items:center;pointer-events:auto;box-shadow:0 4px 12px rgba(0,0,0,.18);animation:pulse 2s infinite}
.mk .nm{position:absolute;left:34px;top:50%;transform:translateY(-50%);white-space:nowrap;background:rgba(255,255,255,.92);border-radius:10px;padding:2px 9px;font-size:12px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;color:var(--ink)}
.mk:hover .nm,.mk.on .nm{opacity:1}.mk.on{background:var(--gold);color:#fff;animation:none;transform:scale(1.15)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,185,75,.6)}70%{box-shadow:0 0 0 11px rgba(242,185,75,0)}100%{box-shadow:0 0 0 0 rgba(242,185,75,0)}}
.stbar{position:absolute;left:14px;bottom:14px;right:14px;display:flex;gap:8px;align-items:flex-end;justify-content:space-between;pointer-events:none;flex-wrap:wrap}
.hint{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:6px 12px;font-size:12px;color:var(--mut)}
.stbtn{display:flex;gap:6px;pointer-events:auto}
.sb{background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:13px;color:#2c5d43;font-weight:500}.sb:hover{background:#fff}
#stat{position:absolute;top:14px;left:14px;max-width:min(380px,70%);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:8px 13px;font-size:13px;font-weight:500;display:none}
aside{overflow-y:auto;border-radius:26px;padding:18px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 16px 40px rgba(31,90,60,.12)}
.badge{display:inline-block;background:#fff3d2;color:#7a5a12;border-radius:99px;padding:2px 11px;font-size:12px;font-weight:600}
aside h2{margin:8px 0 4px;font-size:21px;line-height:1.3;color:var(--g1)}aside p{margin:0;color:var(--mut);font-size:14px}
h4{margin:16px 0 8px;font-size:13px;color:#4b6b58;letter-spacing:.3px}
#chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #cfe3d5;background:rgba(255,255,255,.8);border-radius:99px;padding:4px 11px;font-size:13px;color:#30583f;transition:.2s}.chip:hover{background:#fff;transform:translateY(-1px)}.chip.on{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}
#card{margin-top:12px;min-height:92px;background:rgba(255,255,255,.85);border:1px solid #e4efe6;border-left:5px solid var(--gold);border-radius:16px;padding:12px 15px}
#card b{color:var(--g1)}#card p{margin:3px 0 0;color:#455c4d}
.pop{animation:pop .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.ctl{background:rgba(255,255,255,.75);border:1px solid #e1eee4;border-radius:14px;padding:10px 12px;margin-bottom:8px}
.ctl label{display:flex;justify-content:space-between;font-size:13px;font-weight:500}
.ctl input[type=range]{width:100%;accent-color:#2f9460}
.seg{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.seg button{border:1px solid #cfe3d5;background:#fff;border-radius:10px;padding:4px 10px;font-size:13px;color:#30583f}.seg button.on{background:var(--g1);color:#fff;border-color:var(--g1)}
.btn{border:0;border-radius:13px;padding:9px 14px;font-weight:600;color:#fff;background:linear-gradient(135deg,#1f6b4a,#43a56b);box-shadow:0 6px 14px rgba(31,107,74,.25);transition:.2s;width:100%}.btn:hover{transform:translateY(-2px)}.btn.alt{background:#fff;color:#2c5d43;border:1px solid #cfe3d5;box-shadow:none}.btn:disabled{opacity:.55;cursor:default;transform:none}
#out{background:linear-gradient(120deg,#e9f7eb,#f6f9e8);border:1px solid #d7ead9;border-radius:14px;padding:10px 13px;font-size:13.5px;color:#285e40;margin-top:10px}#out:empty{display:none}
.foot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 13px;border-radius:13px;border:1px solid #d5e5d9;background:#fff;color:#30503f;transition:.2s}.opt:hover{background:#f1faf3;transform:translateX(3px)}.opt.right{background:#dff5e4;border-color:#6fba85}.opt.wrong{background:#fde6e1;border-color:#e0907f}
.score{font-size:44px;font-weight:700;color:var(--g1)}.muted{color:var(--mut);font-size:13px}
.fb{margin-top:8px;font-size:14px;font-weight:500}
@media(max-width:940px){main{grid-template-columns:1fr;height:auto}#stage{height:58vh;min-height:360px}aside{max-height:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
 <div class="brand"><div class="logo">🌿</div><div><b>Plant Explorer 3D</b><small>วิทยาศาสตร์ ม.1 • เรื่องพืช</small></div></div>
 <nav id="nav"></nav>
 <div class="prog"><span id="ptxt">0 / 5 บท</span><div class="bar"><i id="pbar"></i></div></div>
</header>
<main>
 <section id="stage">
  <canvas id="c"></canvas>
  <div id="labels"></div>
  <div id="stat"></div>
  <div class="stbar"><div class="hint">🖱️ คลิก-ลากเพื่อหมุน • ลูกกลิ้งเพื่อซูม • คลิกขวา/ลากสองนิ้วเพื่อแพน • แตะหมายเลขเพื่อสำรวจ</div><div class="stbtn"><button class="sb" id="autoBtn">🔄 หมุนอัตโนมัติ</button><button class="sb" id="camBtn">🎥 รีเซ็ตกล้อง</button></div></div>
 </section>
 <aside id="panel">
  <span class="badge" id="pBadge"></span>
  <h2 id="pTitle"></h2>
  <p id="pDesc"></p>
  <div id="lessonBody">
   <h4>🔎 จุดสำรวจ</h4><div id="chips"></div>
   <div id="card"></div>
   <h4>🎛️ ห้องทดลอง</h4><div id="ctrls"></div>
   <div id="out"></div>
   <div class="foot"><button class="btn alt" id="doneBtn">✓ เรียนจบบทนี้</button><button class="btn" id="nextBtn">บทถัดไป →</button></div>
  </div>
  <div id="quiz" hidden></div>
 </aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
if(!window.THREE||!THREE.OrbitControls){document.body.innerHTML='<p style="padding:30px;font-family:sans-serif">ไม่สามารถโหลด Three.js ได้ กรุณาเชื่อมต่ออินเทอร์เน็ตแล้วรีเฟรชหน้านี้</p>';return}
const T=THREE,$=s=>document.querySelector(s);
const stage=$('#stage'),canvas=$('#c'),labels=$('#labels'),chips=$('#chips'),card=$('#card'),ctrls=$('#ctrls'),out=$('#out'),stat=$('#stat');
let st={done:[],quiz:0};
try{const s=JSON.parse(localStorage.getItem('plantExplorer3D')||'null');if(s&&Array.isArray(s.done))st={done:s.done,quiz:+s.quiz||0}}catch(e){}
const save=()=>{try{localStorage.setItem('plantExplorer3D',JSON.stringify(st))}catch(e){}};

const renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputEncoding=T.sRGBEncoding;
const scene=new T.Scene();
const camera=new T.PerspectiveCamera(42,1,.1,100);camera.position.set(3.6,3.6,5.4);
const controls=new T.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=.07;controls.minDistance=3;controls.maxDistance=14;controls.maxPolarAngle=Math.PI*.52;controls.autoRotateSpeed=1.4;
scene.add(new T.HemisphereLight(0xffffff,0xbfe0c4,.8));
const sunL=new T.DirectionalLight(0xfff2d6,1.1);sunL.position.set(5,9,5);sunL.castShadow=true;sunL.shadow.mapSize.set(1024,1024);
const sc=sunL.shadow.camera;sc.left=-8;sc.right=8;sc.top=8;sc.bottom=-8;sc.far=30;scene.add(sunL);
const ground=new T.Mesh(new T.CircleGeometry(7.5,64),new T.MeshStandardMaterial({color:0xdcefd9,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const rim=new T.Mesh(new T.RingGeometry(7.1,7.5,64),new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.65,side:T.DoubleSide}));rim.rotation.x=-Math.PI/2;rim.position.y=.01;scene.add(rim);

const M=(c,o)=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.55,metalness:.03},o||{}));
const mesh=(g,m,x,y,z,s)=>{const o=new T.Mesh(g,m);o.position.set(x||0,y||0,z||0);o.castShadow=true;o.receiveShadow=true;if(s)o.scale.set(s[0],s[1],s[2]);return o};
const sph=(r,m,x,y,z,s)=>mesh(new T.SphereGeometry(r,24,18),m,x,y,z,s);
const cyl=(a,b,h,m,x,y,z)=>mesh(new T.CylinderGeometry(a,b,h,20),m,x,y,z);
const V=(x,y,z)=>new T.Vector3(x,y,z);
const link=(a,b,r,m)=>{const d=new T.Vector3().subVectors(b,a),o=mesh(new T.CylinderGeometry(r,r,d.length(),12),m);o.position.copy(a).addScaledVector(d,.5);o.quaternion.setFromUnitVectors(V(0,1,0),d.clone().normalize());return o};
const dot=(r,c)=>new T.Mesh(new T.SphereGeometry(r,12,10),new T.MeshBasicMaterial({color:c,transparent:true}));
const tag=(txt,col)=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.fillStyle=col;x.beginPath();x.arc(64,64,58,0,7);x.fill();x.fillStyle='#fff';x.font='bold 46px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,64,68);const s=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),transparent:true}));s.scale.set(.62,.62,1);return s};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function flow(n,mk,fn){const g=new T.Group(),ms=[];for(let i=0;i<n;i++){const m=mk(i);g.add(m);ms.push(m)}return{g,ms,ph:0,sp:.2,tick(dt){this.ph+=dt*this.sp;ms.forEach((m,i)=>fn(m,(i/n+this.ph)%1,i))}}}
function soil(){const g=new T.Group(),roots=new T.Group();g.add(roots);
 const b=mesh(new T.BoxGeometry(3.2,1,2.2),M(0x8a6240,{transparent:true,opacity:.5,roughness:1}),0,.5,0);b.castShadow=false;g.add(b);
 g.add(mesh(new T.BoxGeometry(3.2,.08,2.2),M(0x6b4a2f,{roughness:1}),0,1.02,0));
 const rm=M(0xe8d2a4);
 [[0,1,0,0,.1,0],[0,.95,0,-1,.2,.35],[0,.95,0,1,.25,-.3],[0,.85,0,-.5,.12,-.6],[0,.85,0,.55,.1,.6]].forEach(r=>roots.add(link(V(r[0],r[1],r[2]),V(r[3],r[4],r[5]),.045,rm)));
 return{g,roots}}
function plant(){const h=new T.Group();h.position.y=1.04;const sm=M(0x4a9a5f);h.add(cyl(.06,.1,2.1,sm,0,1.05,0));const lm=[],lv=[],lg=new T.Group();h.add(lg);
 for(let i=0;i<7;i++){const m=M(0x4cb05e,{roughness:.5});lm.push(m);const p=new T.Group();p.rotation.y=i*2.4;p.position.y=.6+i*.2;const l=sph(1,m,.62,0,0,[.58,.07,.3]);l.rotation.z=.3;p.add(l);lg.add(p);lv.push(l)}
 h.add(sph(.13,M(0x7bc86c),0,2.15,0));return{h,lm,lv,lg,sm}}

function flower(){
 const g=new T.Group(),head=new T.Group();head.position.y=2.35;
 g.add(cyl(.09,.13,2.35,M(0x4a9a5f),0,1.175,0));g.add(head);
 const mp=M(0xf49ac1,{roughness:.4,transparent:true}),mp2=M(0xf8b7d3,{roughness:.4,transparent:true}),ms=M(0x5fae6a,{transparent:true}),mo=M(0x9ed07f,{transparent:true,roughness:.35}),mu=M(0xf6d86b),ma=M(0xf4c542),mf=M(0x9ccf6f),my=M(0x8fc96d),mg=M(0xd8579a);
 const sepals=new T.Group(),petals=new T.Group(),fils=new T.Group(),anthers=new T.Group(),ovules=new T.Group();
 [sepals,petals,fils,anthers,ovules].forEach(x=>head.add(x));
 for(let i=0;i<5;i++){const p=new T.Group();p.rotation.y=i*Math.PI*2/5;const c=mesh(new T.ConeGeometry(.17,.75,14),ms,.42,-.12,0);c.rotation.z=-Math.PI/2-.4;p.add(c);sepals.add(p)}
 for(let i=0;i<12;i++){const p=new T.Group(),o=i%2;p.rotation.y=i*Math.PI/6;const m=sph(1,o?mp2:mp,1.15-o*.1,.28+o*.12,0,[.75-o*.1,.1,.38-o*.04]);m.rotation.z=.5-o*.15;p.add(m);petals.add(p)}
 for(let i=0;i<6;i++){const a=i*Math.PI/3+.2,f=new T.Group(),n=new T.Group();f.rotation.y=a;n.rotation.y=a;f.add(link(V(.35,0,0),V(.62,1,0),.035,mf));n.add(sph(.11,ma,.62,1.05,0,[.6,1.4,.6]));fils.add(f);anthers.add(n)}
 const ovary=sph(.38,mo,0,.1,0,[1,1.2,1]),style=cyl(.045,.06,1,my,0,.75,0),stigma=sph(.15,mg,0,1.32,0,[1.3,.8,1.3]);head.add(ovary,style,stigma);
 [[.12,.12,.08],[-.12,.2,.08],[0,0,-.12],[0,.28,-.1]].forEach(p=>ovules.add(sph(.09,mu,p[0],p[1],p[2])));
 const tubeM=M(0xf6d86b,{emissive:0xf6d86b,emissiveIntensity:.5}),tube=mesh(new T.CylinderGeometry(.018,.018,1.05,8),tubeM,0,.25,0);tube.castShadow=false;head.add(tube);
 const pol=[],st0=[],st1=[];
 for(let i=0;i<10;i++){const a=(i%6)*Math.PI/3+.2,p=dot(.05,0xffd21f);head.add(p);pol.push(p);st0.push(V(.62*Math.cos(a),1.05,-.62*Math.sin(a)));st1.push(V(.08*Math.cos(i),1.38,.08*Math.sin(i)))}
 const S={run:false,t:0};
 const msgs=t=>t<=0?'🌼 พร้อมเริ่ม: ละอองเรณูอยู่ที่อับเรณู กด “เริ่มถ่ายเรณู”':t<.33?'🐝 การถ่ายเรณู: ละอองเรณูเคลื่อนไปยังยอดเกสรเพศเมีย':t<.66?'🌱 หลอดเรณูเจริญผ่านก้านเกสรเพศเมียลงสู่รังไข่':t<1?'✨ การปฏิสนธิ: เซลล์สืบพันธุ์เพศผู้รวมกับเซลล์ไข่ในออวุล':'🍎 ออวุลพัฒนาเป็นเมล็ด และรังไข่มักพัฒนาเป็นผล';
 return{g,cam:{t:[0,2.5,0],p:[3.6,3.6,5.4]},
 hs:[
  {o:petals,off:[1.3,.5,0],t:'กลีบดอก',d:'มักมีสีสันหรือกลิ่น ช่วยดึงดูดสัตว์ เช่น แมลง ให้เข้ามาช่วยในการถ่ายเรณู'},
  {o:sepals,off:[.7,-.45,0],t:'กลีบเลี้ยง',d:'อยู่ชั้นนอกสุดของดอก มักมีสีเขียว ทำหน้าที่ห่อหุ้มและป้องกันดอกในระยะดอกตูม'},
  {o:anthers,off:[.75,1.2,0],t:'อับเรณู',d:'อยู่บริเวณปลายเกสรเพศผู้ ทำหน้าที่สร้างและเก็บละอองเรณู'},
  {o:fils,off:[.6,.4,0],t:'ก้านชูอับเรณู',d:'ทำหน้าที่ชูอับเรณูให้อยู่ในตำแหน่งที่เหมาะสมต่อการถ่ายเรณู'},
  {o:stigma,off:[0,.3,0],t:'ยอดเกสรเพศเมีย',d:'อยู่ส่วนบนสุดของเกสรเพศเมีย มีพื้นผิวที่ช่วยรับละอองเรณู'},
  {o:style,off:[.3,0,0],t:'ก้านเกสรเพศเมีย',d:'เชื่อมยอดเกสรเพศเมียกับรังไข่ เป็นทางที่หลอดเรณูเจริญผ่านลงไป'},
  {o:ovary,off:[.55,0,0],t:'รังไข่',d:'อยู่ส่วนโคนของเกสรเพศเมีย ภายในมีออวุล หลังการปฏิสนธิรังไข่มักพัฒนาเป็นผล'},
  {o:ovules,off:[-.6,-.1,0],t:'ออวุล',d:'อยู่ภายในรังไข่ มีเซลล์ไข่ หลังการปฏิสนธิออวุลพัฒนาเป็นเมล็ด'}],
 ctrl:[{id:'cut',type:'range',label:'ทำให้กลีบโปร่งใส (ดูภาพตัด)',min:0,max:100,v:0,u:'%'},
  {type:'button',label:'🐝 เริ่มถ่ายเรณู',fn:()=>{if(S.t>=1)S.t=0;S.run=true}},
  {type:'button',label:'↺ เริ่มจำลองใหม่',fn:()=>{S.run=false;S.t=0}}],

 upd(dt,t,P){xf.sp=.04+P.t*.005;pf.sp=.03+P.q*.004;vf.sp=P.t*.004;vf.g.visible=P.t>0;xy.visible=xf.g.visible=P.v!==2;ph.visible=pf.g.visible=P.v!==1;[xf,pf,vf].forEach(f=>f.tick(dt))}}}

const LES=[
 {ico:'🌸',name:'ดอกและการสืบพันธุ์',title:'ภารกิจที่ 1: ดอกไม้และการสืบพันธุ์ของพืช',desc:'หมุนดูโครงสร้างดอก แตะจุดหมายเลข แล้วจำลองการถ่ายเรณูและการปฏิสนธิ',build:flower},
 {ico:'🧫',name:'การขยายพันธุ์',title:'ภารกิจที่ 2: นักขยายพันธุ์มือโปร',desc:'สำรวจวิธีขยายพันธุ์ 4 แบบ แล้วปรับเป้าหมายการผลิตเพื่อดูวิธีที่เหมาะสม',build:prop},
 {ico:'☀️',name:'สังเคราะห์ด้วยแสง',title:'ภารกิจที่ 3: โรงงานผลิตอาหารของพืช',desc:'ปรับแสง CO₂ และน้ำ เพื่อดูปัจจัยจำกัดอัตราการสังเคราะห์ด้วยแสง',build:photo},
 {ico:'🪴',name:'ธาตุอาหาร',title:'ภารกิจที่ 4: ตามหาธาตุอาหารของพืช',desc:'เรียนรู้บทบาท N-P-K และสังเกตอาการขาดธาตุบนใบ',build:nutrient},
 {ico:'💧',name:'การลำเลียง',title:'ภารกิจที่ 5: ระบบขนส่งมหัศจรรย์ของพืช',desc:'สำรวจเส้นทางไซเล็มและโฟลเอ็มภายในลำต้น แล้วปรับการคายน้ำและความต้องการน้ำตาล',build:trans}];

let cur=null,P={},idx=0,sel=null,goal=null,lastS,markers=[];
const nav=$('#nav');
LES.forEach((l,i)=>{const b=document.createElement('button');b.className='tab';b.textContent=l.ico+' '+l.name;b.onclick=()=>sw(i);nav.appendChild(b)});
const qb=document.createElement('button');qb.className='tab';qb.textContent='🏆 แบบทดสอบ';qb.onclick=()=>sw(5);nav.appendChild(qb);
const tabs=[...nav.children];

function renderProg(){const n=st.done.length;$('#ptxt').textContent=n+' / 5 บท';$('#pbar').style.width=n/5*100+'%';tabs.forEach((t,i)=>t.classList.toggle('ok',i<5&&st.done.includes(i)));const d=$('#doneBtn');if(d){const k=st.done.includes(idx);d.textContent=k?'⭐ เรียนจบแล้ว':'✓ เรียนจบบทนี้';d.disabled=k}}

function clearMarkers(){labels.innerHTML='';markers=[];chips.innerHTML=''}
function buildCtrls(){ctrls.innerHTML='';P={};
 (cur.ctrl||[]).forEach(c=>{const w=document.createElement('div');w.className='ctl';
  if(c.type==='range'){P[c.id]=c.v;w.innerHTML=`<label><span>${c.label}</span><output>${c.v}${c.u}</output></label><input type="range" min="${c.min}" max="${c.max}" value="${c.v}">`;const i=w.querySelector('input'),o=w.querySelector('output');i.oninput=()=>{P[c.id]=+i.value;o.textContent=i.value+c.u;refresh()}}
  else if(c.type==='choice'){P[c.id]=0;w.innerHTML=`<label><span>${c.label}</span></label><div class="seg">${c.opts.map((o,k)=>`<button data-k="${k}" class="${k?'':'on'}">${o}</button>`).join('')}</div>`;w.querySelectorAll('button').forEach(b=>b.onclick=()=>{P[c.id]=+b.dataset.k;w.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));refresh()})}
  else{w.innerHTML=`<button class="btn alt">${c.label}</button>`;w.firstChild.onclick=()=>{c.fn(P);refresh()}}
  ctrls.appendChild(w)})}
function refresh(){out.innerHTML=cur.out?cur.out(P):''}

function sw(i){
 sel=null;goal=null;
 tabs.forEach((t,k)=>t.classList.toggle('on',k===i));
 if(i===5){$('#lessonBody').hidden=true;$('#quiz').hidden=false;$('#pBadge').textContent='ทดสอบความรู้';$('#pTitle').textContent='🏆 แบบทดสอบรวม';$('#pDesc').textContent='ทบทวนความรู้จากทั้ง 5 ภารกิจ';stat.style.display='none';qi=0;sc2=0;qShow();return}
 $('#lessonBody').hidden=false;$('#quiz').hidden=true;idx=i;
 if(cur)scene.remove(cur.g);clearMarkers();
 const L=LES[i];cur=L.build();scene.add(cur.g);sunL.intensity=1.1;
 $('#pBadge').textContent='บทที่ '+(i+1)+' จาก 5';$('#pTitle').textContent=L.title;$('#pDesc').textContent=L.desc;
 camera.position.set(...cur.cam.p);controls.target.set(...cur.cam.t);controls.update();
 cur.hs.forEach((h,k)=>{h.o.traverse(n=>{n.userData.hs=k});
  const m=document.createElement('button');m.className='mk';m.innerHTML=`${k+1}<span class="nm">${h.t}</span>`;m.setAttribute('aria-label',h.t);m.onclick=()=>select(k);labels.appendChild(m);markers.push(m);
  const c=document.createElement('button');c.className='chip';c.textContent=(k+1)+'. '+h.t;c.onclick=()=>select(k);chips.appendChild(c)});
 card.className='';card.innerHTML='<b>👆 เลือกจุดสำรวจ</b><p>แตะหมายเลขบนโมเดล 3D หรือเลือกชื่อด้านบน เพื่ออ่านคำอธิบาย กล้องจะเลื่อนไปยังจุดที่เลือก</p>';
 buildCtrls();refresh();stat.style.display=cur.upd?'block':'none';stat.innerHTML='';lastS=undefined;renderProg();
 $('#nextBtn').textContent=i<4?'บทถัดไป →':'ไปแบบทดสอบ →';
}
function select(k){
 const h=cur.hs[k];card.classList.remove('pop');void card.offsetWidth;card.classList.add('pop');
 card.innerHTML=`<b>${k+1}. ${h.t}</b><p>${h.d}</p>`;
 markers.forEach((m,j)=>m.classList.toggle('on',j===k));[...chips.children].forEach((c,j)=>c.classList.toggle('on',j===k));
 const mats=[];h.o.traverse(n=>{const m=n.material;if(m&&m.emissive){if(m.userData.e0===undefined){m.userData.e0=m.emissive.getHex();m.userData.i0=m.emissiveIntensity}mats.push(m)}});
 if(sel)endFlash();sel={t0:clock.elapsedTime,mats};
 const v=V(...h.off);cur.g.updateMatrixWorld(true);h.o.localToWorld(v);
 const dir=camera.position.clone().sub(controls.target);dir.setLength(clamp(dir.length()*.8,4,9));goal={t:v,p:v.clone().add(dir)};
}
function endFlash(){sel.mats.forEach(m=>{m.emissive.setHex(m.userData.e0);m.emissiveIntensity=m.userData.i0});sel=null}

const ray=new T.Raycaster(),mv=new T.Vector2();let pd=null;
canvas.addEventListener('pointerdown',e=>{pd=[e.clientX,e.clientY]});
canvas.addEventListener('pointerup',e=>{if(!pd||!cur||Math.hypot(e.clientX-pd[0],e.clientY-pd[1])>5)return;const r=canvas.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(mv,camera);ray.camera=camera;
 const hit=ray.intersectObject(cur.g,true).find(x=>x.object.userData.hs!==undefined);if(hit)select(hit.object.userData.hs)});

let auto=false;$('#autoBtn').onclick=()=>{auto=!auto;$('#autoBtn').textContent=auto?'⏸ หยุดหมุน':'🔄 หมุนอัตโนมัติ'};
$('#camBtn').onclick=()=>{if(!cur)return;const t=V(...cur.cam.t);goal={t,p:V(...cur.cam.p)}};
$('#doneBtn').onclick=()=>{if(!st.done.includes(idx)){st.done.push(idx);save();renderProg()}};
$('#nextBtn').onclick=()=>sw(idx+1);

function rs(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
if(window.ResizeObserver)new ResizeObserver(rs).observe(stage);window.addEventListener('resize',rs);

const clock=new T.Clock(),tv=new T.Vector3();
function loop(){requestAnimationFrame(loop);
 const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 if(cur&&cur.upd){const s=cur.upd(dt,t,P);if(s!==undefined&&s!==lastS){lastS=s;stat.innerHTML=s}}
 if(goal){controls.target.lerp(goal.t,.08);camera.position.lerp(goal.p,.08);if(camera.position.distanceTo(goal.p)<.03)goal=null}
 controls.autoRotate=auto;controls.update();
 if(cur){cur.g.updateMatrixWorld(true);const w=stage.clientWidth,h=stage.clientHeight;
  cur.hs.forEach((hs,i)=>{tv.set(hs.off[0],hs.off[1],hs.off[2]);hs.o.localToWorld(tv);tv.project(camera);const m=markers[i];if(!m)return;m.style.display=tv.z<1?'':'none';m.style.left=((tv.x*.5+.5)*w)+'px';m.style.top=((-tv.y*.5+.5)*h)+'px'})}
 if(sel){const k=t-sel.t0;if(k>1.8)endFlash();else sel.mats.forEach(m=>{m.emissive.setHex(0xffc94a);m.emissiveIntensity=.6*Math.abs(Math.sin(k*5))})}
 renderer.render(scene,camera)}

const QS=[
 {q:'โครงสร้างใดของดอกสร้างละอองเรณู',o:['อับเรณู','ยอดเกสรเพศเมีย','รังไข่','กลีบดอก'],a:0,e:'อับเรณูเป็นส่วนหนึ่งของเกสรเพศผู้และสร้างละอองเรณู'},
 {q:'การถ่ายเรณูหมายถึงข้อใด',o:['การย้ายละอองเรณูจากอับเรณูไปยังยอดเกสรเพศเมีย','การงอกของเมล็ด','การเกิดผล','การสร้างราก'],a:0,e:'การถ่ายเรณูคือการย้ายละอองเรณูไปยังยอดเกสรเพศเมีย'},
 {q:'หลังการปฏิสนธิ ออวุลพัฒนาเป็นอะไร',o:['ผล','เมล็ด','ใบ','ลำต้น'],a:1,e:'ออวุลพัฒนาเป็นเมล็ด ส่วนรังไข่พัฒนาเป็นผล'},
 {q:'ข้อใดเป็นการขยายพันธุ์แบบไม่อาศัยเพศ',o:['เพาะเมล็ด','ปักชำ','การผสมเกสร','การปฏิสนธิ'],a:1,e:'การปักชำใช้ส่วนของพืชให้เกิดต้นใหม่โดยไม่เกิดการปฏิสนธิ'},
 {q:'ข้อดีสำคัญของการเพาะเลี้ยงเนื้อเยื่อคืออะไร',o:['ไม่ต้องใช้อุปกรณ์','เพิ่มจำนวนต้นพันธุ์ได้มากในพื้นที่จำกัด','ทำให้พืชไม่ต้องการน้ำ','ใช้ได้กับพืชทุกชนิดโดยไม่มีข้อจำกัด'],a:1,e:'การเพาะเลี้ยงเนื้อเยื่อช่วยเพิ่มจำนวนต้นพันธุ์ภายใต้สภาพควบคุมและปลอดเชื้อ'},
 {q:'แก๊สใดเป็นวัตถุดิบในการสังเคราะห์ด้วยแสง',o:['ออกซิเจน','ไนโตรเจน','คาร์บอนไดออกไซด์','ไฮโดรเจน'],a:2,e:'พืชใช้คาร์บอนไดออกไซด์ร่วมกับน้ำในการสร้างน้ำตาล'},
 {q:'ผลิตภัณฑ์ที่พืชสร้างจากการสังเคราะห์ด้วยแสงคือข้อใด',o:['น้ำตาลและออกซิเจน','ดินและน้ำ','ไนโตรเจนและแร่ธาตุ','โปรตีนและเกลือแร่โดยตรง'],a:0,e:'การสังเคราะห์ด้วยแสงสร้างคาร์โบไฮเดรตและปล่อยออกซิเจน'},
 {q:'ธาตุอาหารใดเกี่ยวข้องกับการสร้างคลอโรฟิลล์และการเจริญของใบ',o:['N','P','K','Na'],a:0,e:'ไนโตรเจนเป็นองค์ประกอบของคลอโรฟิลล์และสารสำคัญหลายชนิด'},
 {q:'เนื้อเยื่อใดลำเลียงน้ำและแร่ธาตุจากราก',o:['โฟลเอ็ม','ไซเล็ม','คอร์เทกซ์','ปากใบ'],a:1,e:'ไซเล็มลำเลียงน้ำและแร่ธาตุ โดยทั่วไปขึ้นจากรากสู่ส่วนเหนือดิน'},
 {q:'ทิศทางการลำเลียงในโฟลเอ็มเป็นอย่างไร',o:['ขึ้นอย่างเดียว','ลงอย่างเดียว','จากแหล่งสร้างไปยังแหล่งใช้หรือสะสม อาจขึ้นหรือลง','ไม่เคลื่อนที่'],a:2,e:'ทิศทางขึ้นกับตำแหน่งแหล่งสร้างและแหล่งรับ'}];
let qi=0,sc2=0;
function qShow(){const q$=$('#quiz');
 if(qi>=QS.length){const pct=Math.round(sc2/QS.length*100);if(sc2>st.quiz){st.quiz=sc2;save()}q$.innerHTML=`<h4>ผลคะแนน</h4><div class="score">${sc2} / ${QS.length}</div><p>คิดเป็น ${pct}% • คะแนนสูงสุด ${st.quiz}/${QS.length}</p><p class="fb">${pct>=80?'🌟 ยอดเยี่ยม!':pct>=60?'👏 ทำได้ดี!':'🌱 ฝึกฝนอีกนิดนะ!'}</p><div class="foot"><button class="btn alt" id="qr">ทำอีกครั้ง</button><button class="btn" id="qb">กลับไปบทที่ 1</button></div>`;$('#qr').onclick=()=>{qi=0;sc2=0;qShow()};$('#qb').onclick=()=>sw(0);return}
 const q=QS[qi];
 q$.innerHTML=`<h4>ข้อ ${qi+1} / ${QS.length}</h4><div class="bar"><i style="width:${qi/QS.length*100}%"></i></div><div id="card" style="margin-top:12px;border-left-color:#43a56b"><b>${q.q}</b></div>${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${'กขคง'[k]}. ${o}</button>`).join('')}<div id="qf" class="fb"></div>`;
 q$.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,ok=k===q.a;if(ok)sc2++;q$.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
  $('#qf').innerHTML=(ok?'✓ ถูกต้อง! ':'✗ ยังไม่ถูกต้อง ')+q.e+'<div class="foot" style="grid-template-columns:1fr"><button class="btn" id="qn">'+(qi<QS.length-1?'ข้อต่อไป →':'ดูผลคะแนน')+'</button></div>';$('#qn').onclick=()=>{qi++;qShow()}})}

rs();sw(0);loop();
})();
</script>
